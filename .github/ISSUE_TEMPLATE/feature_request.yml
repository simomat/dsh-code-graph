name: Feature request
description: Something the plugin should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to find out about a codebase that the four tools cannot answer today,
        or answer too expensively?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New language
        - An existing tool's result (more, less, or different information)
        - A new tool
        - Indexing (what gets included, freshness, performance)
        - Configuration
        - Web UI
        - Something else
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: >
        Optional. For a new language, note whether tree-sitter has a WASM grammar for it — a
        language pack is a grammar plus a query file with @definition.* / @call / @heritage.*
        captures and a noiseMethods list. See Design.md, section "Parsing".

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: >
        Optional, but useful — a workaround tells us how much the gap actually costs.
