name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch supersedes this run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # `engines` demands >= 26 for stable node:sqlite and type stripping.
          node-version: '26'
          cache: pnpm

      # --ignore-scripts because the root `prepare` script is a full build:
      # without it, a build failure would be reported against the install step.
      # Dependency install scripts are denied by allowBuilds in
      # pnpm-workspace.yaml anyway, and the grammars are loaded as WASM.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Run node --test directly rather than `pnpm test`, which would lint again.
      - name: Test
        run: node --test 'tests/**/*.test.mjs'

      # Proves lib/ and the browser bundle emit. The tsdown banner/externals
      # contract has no other build-time gate.
      - name: Build
        run: pnpm run build

      - name: Pack
        run: pnpm pack --pack-destination dist-pack

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-code-graph-package
          path: dist-pack/*.tgz
          if-no-files-found: error
